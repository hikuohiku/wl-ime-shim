    <text class="text small" x="12" y="41">2 返還</text>
    <text class="text small" x="12" y="63">3 偏官</text>
  </g>
  <line class="arrow" x1="248.8" y1="306.9" x2="142.2" y2="182.6"/>
  <polyline class="tip" points="153.9,187.0 142.2,182.6 144.8,194.9"/>
  <polyline class="tip" points="237.1,302.5 248.8,306.9 246.2,294.6"/>
  <text class="label" x="228" y="300" text-anchor="end">offset</text>
</g>
