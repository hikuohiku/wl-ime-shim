<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 376" role="img" aria-labelledby="t d">
<title id="t">IME candidate window position with and without the proxy</title>
<desc id="d">A chat app with text being composed in the message box. Without the proxy, the app reports the caret at the midpoint of the line from the window's top-left corner to the real caret, so the candidate window appears there instead of next to the caret. With the proxy, it appears directly above the caret.</desc>
<style>
  text { font-family: system-ui, "Noto Sans CJK JP", "Noto Sans JP", sans-serif; }
  .title { font-size: 18px; font-weight: 600; fill: #1f2328; }
  .text { font-size: 16px; fill: #1f2328; }
  .small { font-size: 13px; }
  .label { font-size: 15px; font-weight: 600; fill: #cf222e; }
  .ghost-text { font-size: 13px; fill: #57606a; }
  .window { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
  .sidebar { fill: #eaeef2; }
  .line { fill: #d0d7de; }
  .input { fill: #ffffff; stroke: #d0d7de; }
  .popup { fill: #ffffff; stroke: #8c959f; }
  .ghost { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; stroke-dasharray: 5 4; }
  .selected { fill: #ddf4ff; }
  .underline { stroke: #1f2328; stroke-width: 1.5; }
  .caret { stroke: #cf222e; stroke-width: 2.5; }
  .arrow { stroke: #cf222e; stroke-width: 1.5; stroke-dasharray: 4 4; stroke-opacity: 0.55; }
  .tip { fill: none; stroke: #cf222e; stroke-width: 1.5; stroke-opacity: 0.8; stroke-linecap: round; stroke-linejoin: round; }
  @media (prefers-color-scheme: dark) {
    .title, .text { fill: #e6edf3; }
    .label { fill: #ff7b72; }
    .ghost-text { fill: #8b949e; }
    .window { fill: #161b22; stroke: #6e7681; }
    .sidebar { fill: #0d1117; }
    .line { fill: #30363d; }
    .input { fill: #0d1117; stroke: #30363d; }
    .popup { fill: #21262d; stroke: #6e7681; }
    .ghost { fill: #161b22; stroke: #8b949e; }
    .selected { fill: #1f4b77; }
    .underline { stroke: #e6edf3; }
    .caret, .arrow, .tip { stroke: #ff7b72; }
  }
</style>
<g transform="translate(0 0)">
  <text class="title" x="20" y="24">Without the proxy</text>
  <clipPath id="w0"><rect x="20" y="40" width="480" height="320" rx="8"/></clipPath>
