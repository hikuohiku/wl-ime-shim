name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
      CC_x86_64_unknown_linux_musl: musl-gcc
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Check that the tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[0].version')
          test "$TAG" = "v$version"
      - run: cargo test --locked
      - run: cargo build --release --locked --target "$TARGET"
      - name: Upload the binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="wl-ime-shim-$TAG-$TARGET.tar.gz"
          tar czf "$archive" LICENSE -C "target/$TARGET/release" wl-ime-shim
          gh release upload "$TAG" "$archive" --clobber
